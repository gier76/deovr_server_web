name: "PlayaVR Server"
version: "2.0.0"
slug: playavr-server-web
description: "Eigene VR-Videos, Webseiten und yt-dlp-Quellen für Playa und DeoVR streamen (Meta Quest)"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  8000/tcp: 8000
  8443/tcp: 8443
ports_description:
  8000/tcp: "Video-Server (Playa API v2; DeoVR-Bibliothek unter /deovr)"
  8443/tcp: "HTTPS für Vorschaubilder (nur mit Option https_url)"
webui: "http://[HOST]:[PORT:8000]/debug"
map:
  - media:rw
  - share:rw
  - ssl:ro
options:
  video_dir: "/media/deovr"
  update_ytdlp: true
  auto_format: true
  sources: []
schema:
  video_dir: str
  public_url: str?
  default_format: str?
  auto_format: bool?
  thumb_inline: bool?
  hide_broken: bool?
  thumb_test: bool?
  thumb_tunnel: bool?
  https_url: str?
  ssl_cert: str?
  ssl_key: str?
  manual_category: bool?
  format_mode: list(json|filename|title|screen|stereo|none)?
  update_ytdlp: bool?
  sources:
    - name: str
      url: str
      type: list(web|ytdlp)?
      format: str?
      proxy: bool?
      depth: int?
      max_pages: int?
      limit: int?
      max_height: int?
      warmup: bool?
      link_pattern: str?
      cookies: str?
